name: liblanis
description: Build apps and scripts against SPH without Flutter - batteries included.
version: 0.3.2
homepage: https://github.com/lanis-mobile/liblanis
repository: https://github.com/lanis-mobile/liblanis
issue_tracker: https://github.com/lanis-mobile/liblanis/issues

environment:
  sdk: ^3.13.0

dependencies:
  cookie_jar: ^4.0.9
  crypto: ^3.0.8
  dart_date: ^1.5.3
  dio: ^5.11.1
  dio_cookie_manager: ^3.5.0
  html: ^0.15.7
  http: ^1.6.0
  html_unescape: ^2.0.0
  intl: ^0.20.3
  meta: ^1.19.0
  path: ^1.9.1
  pointycastle: ^4.0.0
  riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8
  sqlite3: ^3.9.1
  uuid: ^4.6.0

dev_dependencies:
  analyzer: ^14.7.0
  build: ^5.0.0
  source_gen: ^4.3.1
  liblanis_cache_generator:
    path: packages/liblanis_cache_generator
  build_runner: ^2.17.1
  lints: ^6.1.0
  riverpod_generator: ^4.0.10
  test: ^1.33.0

topics:
  - schulportal
  - lanis
  - education
  - hessen
